# default config
project_name: 'efficient_training'
work_root: 'efficient_diffusion_training'
exp_name: 'exp'
# Flux Klein 4B (transformer + text encoder from same pipeline)
model_path: 'black-forest-labs/FLUX.2-klein-base-4B'
text_encoder_path: ${model_path}
llama_path: 'meta-llama/Llama-3.2-1B'  # fallback if text_encoder_path not set

model:
  latent_size: 32  # Flux2 after patchify: 32 for 512px, 64 for 1024px
  caption_max_seq_length: 512  # Klein uses 512
  caption_channels: 4608  # overridden from pipeline: 3 layers * hidden_size
  text_encoder_out_layers: [9, 18, 27]  # Klein Qwen3 layers

training:
  loss:
    _target_: core.loss.DiffLoss
    params: {}

  gradient_accumulation_steps: 1
  train_batch_size: 256
  num_workers: 16
  num_warmup_steps: 500
  num_train_timesteps: 1000
  fm_shift: 1.0 # flow matching shift
  max_iters: 200000
  class_dropout_prob: 0.1 # dropping prob for classifier-free guidance
  null_emb_path: 'data/null_emb.pth'
  save_freq: 5000
  grad_checkpointing: False
  nblocks_to_apply_grad_checkpointing: -1 # -1 for all blocks
  gradient_clip: 1.0
  resume_from: ''
  start_step: 0
  use_ema: False
  ema_rate: 0.9999

  # Klein alignment (Phase 4/5)
  timestep_scale: 1000  # pass t/1000 to model (Klein convention)
  loss_patchify_mask: false  # direct MSE, no patchify mask (Klein-style)

  # args for timestep sampling
  weighting_scheme: 'logit_normal' 
  logit_mean: 0
  logit_std: 1
  mode_scale: 1.29

  # args for deferred masking
  patch_mixer_depth: -1 # [0, num_blocks-1], None for not using
  mask_ratio: 0.5 # ratio for masking

  transformer_ckpt: ''

validation:
  validation_frequency: 1000
  seed: 0
  num_inference_timesteps: 20
  cfg: 4.5
  num_images_per_prompt: 1

optimizer:
  type: 'AdamW'
  opt_kwargs: 
    lr: 1e-4
    weight_decay: 3e-2
    eps: 1e-10



dataset:
  use_dummy_data: False
  precompute_txt_emb: True  # use precomputed Flux Klein text embeddings
  datasets: [
    'train',
    'valid' 
    ]
